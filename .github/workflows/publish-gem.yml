# Publishes the gem to GitHub Packages. Run it from main after merging a version bump.
name: Publish Gem

on: [workflow_dispatch]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to publish from a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish only from main. This run is on ${GITHUB_REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: |
          # dump the gemspec just for debugging
          echo "Gemspec:"
          cat *.gemspec

          # publish the gem
          echo "Publishing gem..."
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:github: Bearer ${{secrets.GITHUB_TOKEN}}\n" > $HOME/.gem/credentials
          gem build *.gemspec
          gem push --KEY github --host https://rubygems.pkg.github.com/onelogin *.gem
          echo "Done!"
